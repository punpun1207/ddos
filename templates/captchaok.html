<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Xác minh thành công</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #eee;
        }
        .container {
            background: #2d2d44;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        h1 {
            color: #4caf50;
            font-size: 2rem;
        }
        p {
            color: #aaa;
            margin: 20px 0;
        }
        a {
            color: #4c6ef5;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Xác minh thành công!</h1>
        <p>Bạn đã được xác nhận là người dùng hợp pháp.<br>IP của bạn đã được gỡ khỏi danh sách chặn.</p>
        <p><a href="/">Quay lại trang chủ</a></p>
    </div>
</body>
</html>
