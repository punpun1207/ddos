<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SDN Multi‑Class DDoS Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 {
            color: #333;
            font-size: 1.8rem;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auto-btn { background: #2196F3; color: white; }
        .auto-btn:hover { background: #0b7dda; transform: scale(1.02); }
        .manual-btn { background: #ff9800; color: white; }
        .manual-btn:hover { background: #e68a00; transform: scale(1.02); }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card h3 { font-size: 0.9rem; opacity: 0.9; margin-bottom: 10px; }
        .stat-card .value { font-size: 2rem; font-weight: bold; }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .scroll-box {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            background: #f9f9f9;
        }
        .scroll-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .scroll-box li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .type-1 { background: #f44336; color: white; }
        .type-2 { background: #ff9800; color: white; }
        .type-3 { background: #4caf50; color: white; }
        .type-4 { background: #9c27b0; color: white; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #4CAF50;
            color: white;
            position: sticky;
            top: 0;
        }
        .alert-table-wrapper {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.8rem;
            margin: 0 4px;
        }
        .approve { background: #4CAF50; color: white; }
        .reject { background: #f44336; color: white; }
        .whitelist-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .whitelist-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }
        #topology {
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
        }
        @media (max-width: 768px) {
            .two-columns { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
    <script>
        let network = null;
        let chart = null;

        async function fetchData() {
            try {
                const status = await (await fetch('/api/status')).json();
                document.getElementById('mode').innerText = status.mode.toUpperCase();
                document.getElementById('pendingCount').innerText = status.pending_alerts;
                document.getElementById('activeBlocks').innerText = status.active_blocks;

                // Attack statistics
                const attackStats = await (await fetch('/api/attack_stats')).json();
                document.getElementById('attackSyn').innerHTML = `TCP: ${attackStats.syn + attackStats.ack}`;
                document.getElementById('attackUdp').innerHTML = `UDP: ${attackStats.udp}`;
                document.getElementById('attackIcmp').innerHTML = `ICMP: ${attackStats.icmp}`;
                document.getElementById('attackTotal').innerHTML = `Total: ${attackStats.total}`;

                const pending = await (await fetch('/api/pending')).json();
                const tbody = document.querySelector('#alertsTable tbody');
                tbody.innerHTML = '';
                if (pending.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">No pending alerts</td></tr>';
                } else {
                    const types = ['Normal','SYN Flood','UDP Flood','ICMP Flood','ACK Flood'];
                    pending.forEach(alert => {
                        const row = tbody.insertRow();
                        row.insertCell(0).innerText = alert.id;
                        row.insertCell(1).innerText = alert.victim;
                        row.insertCell(2).innerHTML = `<span class="badge type-${alert.attack_type}">${types[alert.attack_type]}</span>`;
                        row.insertCell(3).innerText = (alert.confidence * 100).toFixed(1) + '%';
                        row.insertCell(4).innerText = (alert.attackers || []).slice(0,3).join(', ') + (alert.attackers.length > 3 ? '...' : '');
                        const cell = row.insertCell(5);
                        const approveBtn = document.createElement('button');
                        approveBtn.innerText = 'Approve';
                        approveBtn.className = 'btn-sm approve';
                        approveBtn.onclick = () => fetch(`/approve/${alert.id}`, {method:'POST'}).then(() => fetchData());
                        const rejectBtn = document.createElement('button');
                        rejectBtn.innerText = 'Reject';
                        rejectBtn.className = 'btn-sm reject';
                        rejectBtn.onclick = () => fetch(`/reject/${alert.id}`, {method:'POST'}).then(() => fetchData());
                        cell.appendChild(approveBtn);
                        cell.appendChild(rejectBtn);
                    });
                }

                const blocked = await (await fetch('/api/blocked')).json();
                const blockedDiv = document.getElementById('blockedList');
                if (Object.keys(blocked).length === 0) {
                    blockedDiv.innerHTML = '<div style="padding:20px;text-align:center">No blocked IPs</div>';
                } else {
                    let html = '<ul>';
                    for (const [ip, ttl] of Object.entries(blocked)) {
                        html += `<li><span>${ip}</span><span>expires in ${ttl}s</span></li>`;
                    }
                    html += '</ul>';
                    blockedDiv.innerHTML = html;
                }

                const topo = await (await fetch('/api/topology')).json();
                const ts = await (await fetch('/api/timeseries')).json();
                drawTopology(topo);
                drawChart(ts.ddos_ratio, ts.entropy_dst);
            } catch(e) { console.error(e); }
        }

        function drawTopology(topo) {
            const nodes = [];
            const edges = [];
            topo.switches.forEach(s => nodes.push({ id: s, label: s, shape: 'box', color: '#ccc' }));
            topo.hosts.forEach(h => nodes.push({ id: h, label: h, shape: 'dot', color: 'green' }));
            topo.links.forEach(link => edges.push({ from: link.source, to: link.target }));
            const container = document.getElementById('topology');
            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            if (network) network.destroy();
            network = new vis.Network(container, data, { physics: false });
        }

        function drawChart(ddos_ratio, entropy_dst) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ddos_ratio.map((_, i) => i),
                    datasets: [
                        { label: 'DDoS Ratio', borderColor: '#f44336', data: ddos_ratio, fill: false, tension: 0.3 },
                        { label: 'Entropy Dst', borderColor: '#4caf50', data: entropy_dst, fill: false, tension: 0.3 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }

        setInterval(fetchData, 3000);
        window.onload = fetchData;
    </script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛡️ SDN Multi‑Class DDoS Dashboard</h1>
        <div class="mode-buttons">
            <button class="auto-btn" onclick="fetch('/set_mode/auto', {method:'POST'}).then(()=>fetchData())">🔘 Auto Mode</button>
            <button class="manual-btn" onclick="fetch('/set_mode/manual', {method:'POST'}).then(()=>fetchData())">🔘 Manual Mode</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Current Mode</h3><div class="value" id="mode">--</div></div>
        <div class="stat-card"><h3>Pending Alerts</h3><div class="value" id="pendingCount">0</div></div>
        <div class="stat-card"><h3>Active Blocks</h3><div class="value" id="activeBlocks">0</div></div>
        <div class="stat-card">
            <h3>⚔️ Attack Counts</h3>
            <div class="value" id="attackSyn">TCP: --</div>
            <div class="value" id="attackUdp">UDP: --</div>
            <div class="value" id="attackIcmp">ICMP: --</div>
            <div class="value" id="attackTotal">Total: --</div>
        </div>
    </div>

    <div class="two-columns">
        <div class="card">
            <h3>Blocked IPs</h3>
            <div id="blockedList" class="scroll-box">Loading...</div>
            <div class="whitelist-input">
                <input type="text" id="whitelistIp" placeholder="IP to whitelist">
                <button class="auto-btn" onclick="fetch('/whitelist/add', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ip:document.getElementById('whitelistIp').value})}).then(()=>fetchData())">Add to Whitelist</button>
            </div>
        </div>
        <div class="card">
            <h3>Network Topology</h3>
            <div id="topology"></div>
        </div>
    </div>

    <div class="card">
        <h3>📈 Trends (DDoS Ratio & Entropy)</h3>
        <canvas id="trendChart" width="400" height="200" style="max-height:300px"></canvas>
    </div>

    <div class="card">
        <h3>⚠️ Pending Alerts</h3>
        <div class="alert-table-wrapper">
            <table id="alertsTable">
                <thead>
                    <tr><th>ID</th><th>Victim</th><th>Attack Type</th><th>Confidence</th><th>Attackers</th><th>Actions</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
